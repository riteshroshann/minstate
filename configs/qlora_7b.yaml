workload: shakespeare_hf
model: qlora
hf_model: NousResearch/Llama-2-7b-hf
hf_revision: main
quant: nf4
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets: [q_proj, v_proj]
grad_ckpt: true
block_size: 256
batch_size: 2
micro_batches: 8
max_steps: 600
lr: 2.0e-4
min_lr: 2.0e-5
warmup: 30
weight_decay: 0.0
beta1: 0.9
beta2: 0.99
grad_clip: 1.0
amp: bf16
deterministic: warn
eval_every: 50
eval_samples: 64
eval_batch: 4
ckpt_every: 50
ckpt_strategy: w_vr1
strategy: w_vr1
out_dir: runs/qlora_7b
